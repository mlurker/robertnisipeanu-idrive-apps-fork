# mlurker-hud-signals settings. A file of the same keys at
# /var/opt/mlurker-hud-signals/mlurker-hud-signals.local.conf overrides these and survives updates.

# The cluster renderer's socket and the target the arrows are drawn on (the HUD is
# 800x480).
render_socket = /dev/shm/cluster-render/render.sock
target = hud
# ambient, content, overlay or alert: the stack's order, bottom to top. The map is
# content, so the arrows lie over it.
layer_class = overlay

# Which indicators to draw.
left = 1
right = 1
# The arrow's size in pixels (square, 16-400, even), and its distance from the
# target's bottom and side edges. The car's HUD shows only about x 126-679, y 99-379 of
# the 800x480 scene, so the defaults put small arrows (36 px) at that window's bottom corners, beside the
# car's own speed-limit sign, as placed on a G05.
arrow_size = 36
margin_x = 120
# the right arrow's distance from the right edge (the left one uses margin_x)
margin_right_x = 122
margin_y = 112
# The colour, RRGGBB (the HUD shows black as nothing), and its brightness, 10-100 %.
color = 2bd96b
opacity = 100
# A file that moves the arrows while the service runs (no restart): lines "left X Y" and
# "right X Y", the arrow's top-left corner in the target's pixels; empty: none.
place_file = /var/opt/mlurker-hud-signals/place
# Off by default since 0.1.0 (readouts = 1 turns them on). Three readouts, each a small title over a bold value: the gear (P R N D1-D9), the fuel range and the
# electric range. readout_dir v: a vertical strip from the top-left corner of the visible window (readout_x,
# readout_y is the first one's top-left corner; readout_gap pixels between them); h: a row (readout_x, readout_y
# is the first one, readout_w the width of each). miles = 1 shows miles, 0 km. "gear X Y", "gas X Y" and
# "ev X Y" in the place file move them live; "bsleft X Y" and "bsright X Y" move the blind spot marks.
readouts = 0
readout_dir = v
readout_gap = 8
readout_x = 130
readout_y = 104
readout_w = 76
readout_color = ffffff
miles = 1
# How long a lamp-on phase shows after the car's pulse, in ms (50-600): BMW's lamps
# are on for about a third of the 640 ms period.
on_ms = 330
# 1: the layers stay on the HUD, transparent, between flashes, so the HUD's slot is
# already ours at the first flash. 0: they are taken off between flashes.
hold = 1

# The blind spot lamp (on by default; 0 turns it off): a diagnostic read (22 D347, read only) of the body controller every 300 ms
# gives the state of the lane change warning lamp in each exterior mirror (off, steady, flashing). Glowing yellow arcs
# show at the HUD window's edge of that side, centred vertically, steady or blinking like the lamp. Size and the distance from the
# scene's left / right / bottom edges (the defaults are the corners of the HUD's visible window, x 126-679, y 99-379 of
# 800x480). Needs the TASU service; see README.md.
blindspot = 1
blindspot_w = 51
blindspot_h = 158
blindspot_margin_x = 126
blindspot_margin_right_x = 121
blindspot_margin_y = 162

# A log file that outlives the journal's few minutes; empty: none.
log_file = /var/opt/mlurker-hud-signals/log/mlurker-hud-signals.log
log_file_kb = 256
