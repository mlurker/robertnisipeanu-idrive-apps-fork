<!-- mlurker-hud-signals icon: HUD screen with blind spot arcs, speed and green turn arrows. Vector redraw of icon.png (same layout, stretched to the square). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140"><defs>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6ecf7"/><stop offset="0.5" stop-color="#9fb0cc"/><stop offset="1" stop-color="#d4dcec"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14305c"/><stop offset="0.45" stop-color="#091a34"/><stop offset="1" stop-color="#040a16"/></linearGradient>
<linearGradient id="arcO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc400"/><stop offset="0.5" stop-color="#ffdc00"/><stop offset="1" stop-color="#ff9800"/></linearGradient>
